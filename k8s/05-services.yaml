apiVersion: v1
kind: Service
metadata:
  name: accountservice
  namespace: bank
spec:
  selector:
    app: accountservice
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accountservice
  namespace: bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accountservice
  template:
    metadata:
      labels:
        app: accountservice
    spec:
      containers:
        - name: accountservice
          image: accountservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=15.0 -XX:MaxDirectMemorySize=96m
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/csb
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-database
                  key: mysql-root-password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discoveryservice:8761/eureka/
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 640Mi
          startupProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
---

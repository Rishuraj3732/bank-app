apiVersion: v1
kind: Service
metadata:
  name: swiggygateway
  namespace: bank
spec:
  type: NodePort
  selector:
    app: swiggygateway
  ports:
    - name: http
      port: 8765
      targetPort: 8765
      nodePort: 30765
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggygateway
  namespace: bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggygateway
  template:
    metadata:
      labels:
        app: swiggygateway
    spec:
      containers:
        - name: swiggygateway
          image: swiggy-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=15.0 -XX:MaxDirectMemorySize=96m
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discoveryservice:8761/eureka/
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: FRONTEND_ORIGIN_NODEPORT
              value: http://localhost:30080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 640Mi
          startupProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 10

apiVersion: v1
kind: Service
metadata:
  name: discoveryservice
  namespace: bank
spec:
  selector:
    app: discoveryservice
  ports:
    - name: http
      port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discoveryservice
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discoveryservice
  template:
    metadata:
      labels:
        app: discoveryservice
    spec:
      containers:
        - name: discoveryservice
          image: rishuraj1/discoveryservice:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8761
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=15.0 -XX:MaxDirectMemorySize=96m
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 640Mi
          startupProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8761
            periodSeconds: 10
